name: Final main validation

on:
  push:
    branches:
      - 'work-item/**'
      - 'integration/**'

concurrency:
  group: final-main-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  final-main:
    name: final-main
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-android
      - name: Validate governed candidate
        run: ./gradlew detekt lintDebug testDebugUnitTest assembleDebug
